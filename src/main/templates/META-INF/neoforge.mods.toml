modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="brooswit"
description='''Flowing fluid passing over or beside a layered/layerable block has a chance to erode it by a layer.'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Layered Slopes provides the layered block family this mod's erosion code operates on
# (MINECRAFT-513 extraction); required so a missing install fails loudly at startup instead
# of silently losing layered-block behavior.
[[dependencies.${mod_id}]]
    modId="layeredslopes"
    type="required"
    versionRange="[${layeredslopes_version},)"
    ordering="AFTER"
    side="BOTH"

# Targets the optional Flowing Fluids mod's own internal fluid-amount setter (@Pseudo, see
# LevelingMixin) so RecentFlowActivity can verify its periodic random-leveling transfers too, not
# just its main scheduled tick -- silently skipped by Mixin whenever that class cannot be found,
# exactly as when Flowing Fluids itself is not installed.
[[mixins]]
config="${mod_id}.mixins.json"
